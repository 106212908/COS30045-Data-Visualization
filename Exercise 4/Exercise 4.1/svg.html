<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SVG House and Garden</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <h1>Exercise 4.1 - Draw SVG</h1>

    <svg class="before-background" width="900" height="600" viewBox="0 0 900 600">

        <!-- SUN - CIRCLE -->

        <circle
            cx="780"
            cy="90"
            r="50"
            fill="yellow"
            stroke="orange"
            stroke-width="5"
        />

        <!-- CLOUD - ELLIPSES -->
        
        <ellipse
            cx="150"
            cy="80"
            rx="70"
            ry="30"
            fill="white"
        />

        <ellipse
            cx="210"
            cy="80"
            rx="60"
            ry="35"
            fill="white"
        />

        <ellipse
            cx="260"
            cy="90"
            rx="50"
            ry="25"
            fill="white"
        />

        <!-- GROUND - RECTANGLE -->

        <rect
            x="0"
            y="450"
            width="900"
            height="150"
            fill="lightgreen"
        />

        <!-- HOUSE BODY - RECTANGLE -->

        <rect
            x="250"
            y="250"
            width="400"
            height="250"
            class="house"
        />

        <!-- ROOF - POLYGON -->

        <polygon
            points="200,250 450,100 700,250"
            fill="firebrick"
            stroke="black"
            stroke-width="4"
        />
        
        <!-- CHIMNEY - RECTANGLE -->

        <rect
            x="570"
            y="145"
            width="50"
            height="120"
            fill="brown"
            stroke="black"
            stroke-width="3"
        />

        <!-- WINDOWS GROUP -->

        <g
            class="window"
            transform="translate(0,0)"
        >

            <!-- LEFT WINDOW -->

            <rect
                x="300"
                y="300"
                width="90"
                height="90"
            />

            <!-- RIGHT WINDOW -->

            <rect
                x="510"
                y="300"
                width="90"
                height="90"
            />

        </g>

        <!-- WINDOW CROSS BARS - LINES -->

        <line
            x1="345"
            y1="300"
            x2="345"
            y2="390"
            stroke="black"
            stroke-width="3"
        />

        <line
            x1="300"
            y1="345"
            x2="390"
            y2="345"
            stroke="black"
            stroke-width="3"
        />

        <line
            x1="555"
            y1="300"
            x2="555"
            y2="390"
            stroke="black"
            stroke-width="3"
        />

        <line
            x1="510"
            y1="345"
            x2="600"
            y2="345"
            stroke="black"
            stroke-width="3"
        />

        <!-- DOOR - RECTANGLE -->

        <rect
            x="415"
            y="370"
            width="70"
            height="130"
            fill="saddlebrown"
            stroke="black"
            stroke-width="3"
        />

        <!-- DOOR KNOB - RECTANGLE -->

        <circle
            cx="470"
            cy="435"
            r="6"
            fill="gold"
        />

        <!-- PATH - POLYGON -->

        <polygon
            points="415,500 485,500 550,600 350,600"
            fill="burlywood"
            stroke="black"
            stroke-width="2"
        />

        <!-- TREE TRUNK - RECTANGLE -->

        <rect
            x="100"
            y="350"
            width="45"
            height="150"
            fill="saddlebrown"
            stroke="black"
            stroke-width="2"
        />

        <!-- TREE LEAVES - CIRCLE  -->

        <circle
            cx="120"
            cy="300"
            r="70"
            class="tree"
        />

        <circle
            cx="70"
            cy="340"
            r="55"
            class="tree"
        />

        <circle
            cx="170"
            cy="340"
            r="55"
            class="tree"
        />

        <!-- FENCE - LINES -->

        <line
            x1="700"
            y1="430"
            x2="850"
            y2="430"
            stroke="brown"
            stroke-width="8"
        />

        <line
            x1="700"
            y1="430"
            x2="700"
            y2="520"
            stroke="brown"
            stroke-width="8"
        />

        <line
            x1="750"
            y1="430"
            x2="750"
            y2="520"
            stroke="brown"
            stroke-width="8"
        />

        <line
            x1="800"
            y1="430"
            x2="800"
            y2="520"
            stroke="brown"
            stroke-width="8"
        />

        <line
            x1="850"
            y1="430"
            x2="850"
            y2="520"
            stroke="brown"
            stroke-width="8"
        />

        <!-- TEXT -->

        <text
            x="450"
            y="70"
            text-anchor="middle"
            class="text"
            fill="darkblue">
            Before
        </text>

    </svg>
</body>
</html>
