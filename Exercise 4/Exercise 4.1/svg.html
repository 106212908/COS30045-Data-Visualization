<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SVG House and Garden</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <h1>Exercise 4.1 - Draw SVG</h1>

    <svg class="background" width="900" height="600" viewBox="0 0 900 600">

        <!-- SUN - CIRCLE -->

        <circle
            cx="780"
            cy="90"
            r="50"
            fill="yellow"
            stroke="orange"
            stroke-width="5"
        />

        <!-- CLOUD - ELLIPSES -->
        
        <ellipse
            cx="150"
            cy="80"
            rx="70"
            ry="30"
            fill="white"
        />

        <ellipse
            cx="210"
            cy="80"
            rx="60"
            ry="35"
            fill="white"
        />

        <ellipse
            cx="260"
            cy="90"
            rx="50"
            ry="25"
            fill="white"
        />

        <!-- GROUND - RECTANGLE -->

        <rect
            x="0"
            y="450"
            width="900"
            height="150"
            fill="lightgreen"
        />

        <!-- HOUSE BODY - RECTANGLE -->

        <rect
            x="250"
            y="250"
            width="400"
            height="250"
            class="house"
        />

        <!-- ROOF - POLYGON -->

        <polygon
            points="200,250 450,100 700,250"
            fill="firebrick"
            stroke="black"
            stroke-width="4"
        />
        
    </svg>
</body>
</html>
